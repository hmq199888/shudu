name: Build Capacitor APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          cd sudoku-game
          npm install

      - name: Build web app
        run: |
          cd sudoku-game
          npm run build

      - name: Add Android platform
        run: |
          cd sudoku-game
          npx cap add android

      - name: Sync web to Android
        run: |
          cd sudoku-game
          npx cap sync android

      - name: Build Android APK
        run: |
          cd sudoku-game/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sudoku-apk
          path: sudoku-game/android/app/build/outputs/apk/debug/*.apk
          retention-days: 5
